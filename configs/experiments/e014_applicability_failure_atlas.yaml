    - learned_equal
  metrics:
    - profile_mae
    - barrier_abs_error
  tie_tolerance_kcal_mol: 1.0e-12
  gp_noise_variance: 0.0025
  metric_replay_tolerance_kcal_mol: 1.0e-5
  bootstrap_repeats: 5000
  bootstrap_seed_salt: E014-applicability-failure-atlas
