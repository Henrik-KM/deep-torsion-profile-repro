    - torsion_descriptor_distance_quartile
    - heavy_atom_quartile
    - central_bond_class
    - formal_charge_class
  representative_roles:
    - median_learned_profile_mae
    - p95_learned_profile_mae
    - largest_profile_mae_regression_vs_zero_shot
    - largest_barrier_regression_vs_learned_equal
expected:
